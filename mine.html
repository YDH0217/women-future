<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的中心</title>
    <style>
        :root{--main:#9B7BCC;--light:#f6f3fc}
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#f9f9f9;padding:20px}
        .container{max-width:700px;margin:auto}
        .card{background:white;padding:18px;margin:10px 0;border-radius:10px;cursor:pointer}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center}
        .modalBody{background:white;width:90%;max-width:500px;padding:24px;border-radius:12px}
        input{padding:10px;width:100%;margin:10px 0;border-radius:6px;border:1px solid #ddd}
    </style>
</head>
<body>
<div class="container">
    <h2>我的档案</h2>
    <input id="search" placeholder="搜索" oninput="load()">
    <div id="list"></div>
</div>

<div class="modal" id="modal">
    <div class="modalBody">
        <div id="detail"></div>
        <br>
        <button onclick="closeModal()">关闭</button>
    </div>
</div>

<script>
const DB_NAME = "WomenFutureDB";
const STORE = "archives";
let db;

function openDB() {
    return new Promise(resolve => {
        const req = indexedDB.open(DB_NAME,1);
        req.onupgradeneeded = e=>{
            db=e.target.result;
            if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:"id"});
        };
        req.onsuccess=e=>{db=e.target.result;resolve()};
    });
}

async function load(){
    await openDB();
    const tx=db.transaction(STORE,"readonly");
    const req=tx.objectStore(STORE).getAll();
    req.onsuccess=()=>{
        let list=req.result;
        const kw=document.getElementById("search").value.toLowerCase();
        if(kw) list=list.filter(i=>i.q.toLowerCase().includes(kw)||i.book.toLowerCase().includes(kw));
        render(list);
    };
}

function render(list){
    const box=document.getElementById("list");
    box.innerHTML=list.map(i=>`
        <div class="card" onclick="openDetail(${JSON.stringify(i).replace(/"/g,"&quot;")})">
            <h4>${i.q}</h4>
            <p>书名：${i.book}</p>
            <p>ID：${i.id}</p>
        </div>
    `).join("");
}

function openDetail(item){
    document.getElementById("detail").innerHTML=`
        <h3>${item.q}</h3>
        <p>书名：${item.book}</p>
        <p>ID：${item.id}</p>
        <p>分类：${item.cate}</p>
        <p>答案：${item.ans}</p>
        <p>摘录：${item.excerpt}</p>
        <p>总结：${item.summary}</p>
        <p>渠道：${item.source}</p>
    `;
    document.getElementById("modal").style.display="flex";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

window.onload=load;
</script>
</body>
</html>
