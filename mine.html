<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的中心 - Women Future</title>
    <style>
        :root {
            --main: #9B7BCC;
            --dark: #7A57B8;
            --light: #E8DFF5;
            --bg: #FAF9FC;
            --white: #fff;
            --gray: #f6f3fc;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        }
        body {
            background: var(--bg);
        }
        .nav {
            height: 65px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 10px rgba(155,123,204,0.1);
            position: sticky; top:0; z-index:99;
        }
        .logo { font-size:20px; font-weight:bold; color:var(--main); }
        .menu a {
            margin-left:20px;
            text-decoration:none;
            color:#555;
        }
        .menu a.active { color:var(--main); font-weight:bold; }

        .wrap{
            max-width:900px;
            margin:30px auto;
            display:flex;
            gap:28px;
            padding:0 20px;
        }
        .left{ width:240px; }
        .side-card{
            background:#fff;
            padding:24px;
            border-radius:14px;
            position:sticky; top:90px;
        }
        .side-title{
            margin-bottom:12px;
            font-weight:bold;
            color:var(--dark);
        }
        .search-row{
            display:flex;
            gap:8px;
            margin-bottom:20px;
        }
        .side-input{
            flex:1;
            padding:10px;
            border:1px solid #eee;
            border-radius:8px;
        }
        .side-btn{
            background:var(--main);
            color:#fff;
            border:none;
            border-radius:8px;
            padding:0 12px;
            cursor:pointer;
        }
        .cate-line1,.cate-line2{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin-bottom:8px;
        }
        .cate-item{
            background:var(--light);
            padding:6px 10px;
            border-radius:20px;
            font-size:13px;
            cursor:pointer;
        }
        .cate-item.active{
            background:var(--main);
            color:#fff;
        }

        .right{ flex:1; }
        .page-title{
            margin-bottom:20px;
            font-size:18px;
            color:var(--dark);
        }
        .card{
            background:#fff;
            padding:20px;
            border-radius:14px;
            margin-bottom:16px;
            border-left:4px solid var(--main);
            cursor:pointer;
            transition:0.2s;
        }
        .card:hover{
            transform:translateY(-2px);
            box-shadow:0 4px 10px rgba(155,123,204,0.1);
        }
        .question{
            font-weight:bold;
            margin-bottom:6px;
            color:var(--dark);
        }
        .tip{
            font-size:12px;
            color:#999;
            margin-top:6px;
        }

        .empty-tip{
            text-align:center;
            padding:40px 20px;
            color:#999;
        }

        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding:20px;
        }
        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 680px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 36px;
            border-radius: 18px;
            position: relative;
        }
        .close {
            position: absolute;
            top: 20px; right: 24px;
            font-size: 26px;
            cursor: pointer;
            color: #aaa;
        }
        .modal-title {
            font-size: 20px;
            color: var(--dark);
            margin-bottom: 28px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--light);
        }
        .field {
            margin-bottom: 20px;
        }
        .field label {
            display: block;
            font-size: 14px;
            color: #888;
            margin-bottom: 6px;
        }
        .field .value {
            font-size: 15px;
            color: #333;
            line-height: 1.7;
            background: var(--gray);
            padding: 12px 14px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="nav">
    <div class="logo">Women Future</div>
    <div class="menu">
        <a href="index.html">封面</a>
        <a href="search.html">检索</a>
        <a href="create.html">新建档案</a>
        <a href="mine.html" class="active">我的中心</a>
    </div>
</div>

<div class="wrap">
    <div class="left">
        <div class="side-card">
            <div class="side-title">档案检索</div>
            <div class="search-row">
                <input class="side-input" id="mineSearch" placeholder="书名/ID/关键词">
                <button class="side-btn" onclick="doSearch()">搜索</button>
            </div>
            <div class="side-title">分类筛选</div>
            <div class="cate-line1">
                <div class="cate-item active" data-cate="全部">全部</div>
                <div class="cate-item" data-cate="世界文学">世界文学</div>
                <div class="cate-item" data-cate="社会认知">社会认知</div>
                <div class="cate-item" data-cate="情绪心理">情绪心理</div>
            </div>
            <div class="cate-line2">
                <div class="cate-item" data-cate="人文历史">人文历史</div>
                <div class="cate-item" data-cate="职场技能">职场技能</div>
                <div class="cate-item" data-cate="商业理财">商业理财</div>
                <div class="cate-item" data-cate="自我成长">自我成长</div>
            </div>
        </div>
    </div>

    <div class="right">
        <h2 class="page-title">我的档案</h2>
        <div id="mineList"></div>
    </div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <div id="modalContent"></div>
    </div>
</div>

<script>
let currentCate = "全部";
let allData = [];

window.onload = function () {
    loadMyData();
    bindCateClick();
    bindEnterSearch();
};

// 加载 create.html 上传的所有数据
function loadMyData() {
    allData = JSON.parse(localStorage.getItem("archiveList") || "[]");
    renderList(allData);
}

// 渲染列表
function renderList(data) {
    const box = document.getElementById("mineList");
    if (data.length === 0) {
        box.innerHTML = `<div class="empty-tip">暂无档案，快去 <a href="create.html" style="color:var(--main)">新建档案</a></div>`;
        return;
    }
    box.innerHTML = data.map((item, idx) => `
        <div class="card" data-idx="${idx}">
            <div class="question">${item.q}</div>
            <div>书名：${item.book}</div>
            <div>ID：${item.id}</div>
            <div class="tip">分类：${item.cate}</div>
        </div>
    `).join("");

    // 点击卡片打开详情
    document.querySelectorAll(".card").forEach(card => {
        card.onclick = () => {
            const idx = card.dataset.idx;
            openDetail(allData[idx]);
        };
    });
}

// 搜索 + 分类 联动筛选
function doSearch() {
    const kw = document.getElementById("mineSearch").value.toLowerCase();
    let filtered = allData;

    if (currentCate !== "全部") {
        filtered = filtered.filter(i => i.cate === currentCate);
    }
    if (kw) {
        filtered = filtered.filter(i =>
            i.q.toLowerCase().includes(kw) ||
            i.book.toLowerCase().includes(kw) ||
            i.id.toLowerCase().includes(kw)
        );
    }
    renderList(filtered);
}

// 分类点击
function bindCateClick() {
    const items = document.querySelectorAll(".cate-item");
    items.forEach(i => {
        i.onclick = () => {
            items.forEach(x => x.classList.remove("active"));
            i.classList.add("active");
            currentCate = i.dataset.cate;
            doSearch();
        };
    });
}

// 回车搜索
function bindEnterSearch() {
    document.getElementById("mineSearch").addEventListener("keyup", e => {
        if (e.key === "Enter") doSearch();
    });
}

// 打开美观详情弹窗
function openDetail(item) {
    const html = `
        <div class="modal-title">档案详情</div>
        <div class="field"><label>核心问题</label><div class="value">${item.q || '无'}</div></div>
        <div class="field"><label>书名</label><div class="value">${item.book || '无'}</div></div>
        <div class="field"><label>编辑ID</label><div class="value">${item.id || '无'}</div></div>
        <div class="field"><label>问题答案</label><div class="value">${item.ans || '无'}</div></div>
        <div class="field"><label>精彩摘录</label><div class="value">${item.excerpt || '无'}</div></div>
        <div class="field"><label>阅读总结</label><div class="value">${item.summary || '无'}</div></div>
        <div class="field"><label>获取渠道</label><div class="value">${item.source || '无'}</div></div>
    `;
    document.getElementById("modalContent").innerHTML = html;
    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}
</script>
</body>
</html>
