<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建档案 - Women Future</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        :root {
            --main: #9B7BCC;
            --light: #E8DFF5;
            --dark: #7A57B8;
            --bg: #FAF9FC;
            --white: #ffffff;
            --gray: #666;
        }

        body {
            background: var(--bg);
        }

        /* 导航栏 */
        .nav {
            background: var(--white);
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 10px rgba(155, 123, 204, 0.1);
            position: sticky;
            top: 0;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--main);
        }

        .menu a {
            margin-left: 20px;
            text-decoration: none;
            color: #555;
            font-size: 15px;
        }

        .menu a.active {
            color: var(--main);
            font-weight: 500;
        }

        /* 容器 */
        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* 卡片 */
        .card {
            background: var(--white);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .card h2 {
            color: var(--dark);
            margin-bottom: 24px;
            font-size: 20px;
        }

        /* 表单项 */
        .form-item {
            margin-bottom: 20px;
        }

        .form-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--main);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        /* 按钮 */
        .btn-submit {
            background: var(--main);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            width: 100%;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: var(--dark);
        }

        /* 提示文字 */
        .tip {
            font-size: 12px;
            color: var(--gray);
            margin-top: 5px;
        }

        /* 弹窗遮罩 */
        .mask{
            display:none;
            position:fixed;
            left:0;top:0;
            width:100%;height:100%;
            background:rgba(0,0,0,0.5);
            z-index:999;
            align-items:center;
            justify-content:center;
        }
        .pop-box{
            background:#fff;
            padding:24px;
            border-radius:12px;
            max-width:420px;
        }
        .preview-card{
            background:var(--light);
            border-left:4px solid var(--main);
            padding:16px;
            border-radius:8px;
            margin:12px 0 20px;
        }
        .preview-q{
            font-size:16px;
            font-weight:500;
            color:#333;
            margin-bottom:6px;
        }
        .preview-book{
            font-size:13px;
            color:#555;
            margin-bottom:4px;
        }
        .preview-id{
            font-size:12px;
            color:var(--gray);
        }
        .btn-wrap{
            display:flex;
            gap:12px;
        }
        .pop-btn-ok{
            flex:1;
            padding:10px;
            background:var(--main);
            color:white;
            border:none;
            border-radius:8px;
        }
        .pop-btn-back{
            flex:1;
            padding:10px;
            background:#ddd;
            color:#333;
            border:none;
            border-radius:8px;
        }
    </style>
</head>
<body>
    <!-- 导航 -->
    <div class="nav">
        <div class="logo">Women Future</div>
        <div class="menu">
            <a href="index.html">首页</a>
            <a href="create.html" class="active">新建档案</a>
            <a href="mine.html">我的中心</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>创建书籍档案</h2>
            <form id="createForm">
                <!--1.编辑ID：填写无任何限制，保存后锁定不可修改-->
                <div class="form-item">
                    <label>1. 编辑ID（保存后永久锁定，无法修改）</label>
                    <input type="text" id="uid" placeholder="自定义编辑ID，任意填写" required>
                    <div class="tip">预览阶段可返回修改，确认保存后ID固定不可更改</div>
                </div>

                <!--2.书名-->
                <div class="form-item">
                    <label>2. 书名</label>
                    <input type="text" id="bookName" required>
                </div>

                <!--3.分类-->
                <div class="form-item">
                    <label>3. 书籍分类</label>
                    <select id="cate" required>
                        <option value="">请选择分类</option>
                        <option>文学治愈</option>
                        <option>社会认知</option>
                        <option>情绪心理</option>
                        <option>人文历史</option>
                        <option>职场技能</option>
                        <option>商业轻财</option>
                        <option>自我成长</option>
                    </select>
                </div>

                <!--4.摘录-->
                <div class="form-item">
                    <label>4. 摘录</label>
                    <textarea id="excerpt" placeholder="摘抄书中打动你的句子"></textarea>
                </div>

                <!--5.总结-->
                <div class="form-item">
                    <label>5. 总结</label>
                    <textarea id="summary" placeholder="写下你的阅读总结与感悟"></textarea>
                </div>

                <!--6.核心问题-->
                <div class="form-item">
                    <label>6. 本书的1个核心问题（必填）</label>
                    <input type="text" id="qus" required placeholder="例如：如何缓解焦虑、提升职场竞争力？">
                </div>

                <!--7.答案-->
                <div class="form-item">
                    <label>7. 答案（必填）</label>
                    <textarea id="ans" required placeholder="结合书籍与自身经历，真诚写下你的答案"></textarea>
                </div>

                <!--8.获取渠道-->
                <div class="form-item">
                    <label>8. 获取书籍渠道</label>
                    <input type="text" id="source" placeholder="例如：微信读书、纸质书、图书馆">
                </div>

                <!--发布状态-->
                <div class="form-item">
                    <label>发布状态</label>
                    <select id="status">
                        <option>公开（可被他人查看）</option>
                        <option>私密（仅自己可见）</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">发布档案</button>
            </form>
        </div>
    </div>

    <!--预览弹窗：三行排版+双按钮-->
    <div class="mask" id="popMask">
        <div class="pop-box">
            <h3 style="color:#7A57B8;margin-bottom:8px;">档案生成预览</h3>
            <div class="preview-card">
                <div class="preview-q" id="previewQus"></div>
                <div class="preview-book" id="previewTitle"></div>
                <div class="preview-id">编辑ID：<span id="previewId"></span></div>
            </div>
            <div class="btn-wrap">
                <button class="pop-btn-back" onclick="backEdit()">返回修改</button>
                <button class="pop-btn-ok" onclick="confirmOk()">确认保存</button>
            </div>
        </div>
    </div>

    <script>
        const mask=document.getElementById('popMask');
        //返回修改：关闭弹窗，表单保留填写内容继续改
        function backEdit(){
            mask.style.display='none';
        }
        //确认保存=ID永久锁定，跳转首页
        function confirmOk(){
            location.href='index.html'
        }
        document.getElementById('createForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('previewQus').innerText = document.getElementById('qus').value;
            document.getElementById('previewTitle').innerText = document.getElementById('bookName').value;
            document.getElementById('previewId').innerText = document.getElementById('uid').value;
            mask.style.display='flex';
        });
    </script>
</body>
</html>
