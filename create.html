<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新建档案</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: Arial,sans-serif}
        .box{max-width:600px;margin:40px auto;padding:20px}
        input,textarea,select{width:100%;margin:8px 0;padding:12px;border:1px solid #ddd;border-radius:6px}
        button{background:#9B7BCC;color:white;padding:14px;border:none;border-radius:6px;width:100%;margin-top:10px}
        label{font-weight:bold;color:#555}
    </style>
</head>
<body>
<div class="box">
    <h2>新建档案</h2>
    <label>核心问题</label><input id="q">
    <label>书名</label><input id="book">
    <label>编辑ID</label><input id="editId">
    <label>分类</label>
    <select id="cate">
        <option>世界文学</option>
        <option>社会认知</option>
        <option>情绪心理</option>
        <option>人文历史</option>
        <option>职场技能</option>
        <option>商业理财</option>
        <option>自我成长</option>
    </select>
    <label>问题答案</label><textarea id="ans" rows="3"></textarea>
    <label>精彩摘录</label><textarea id="excerpt" rows="3"></textarea>
    <label>阅读总结</label><textarea id="summary" rows="3"></textarea>
    <label>获取渠道</label><input id="source">
    <button onclick="save()">保存档案</button>
</div>

<script>
const DB_NAME = "WomenFutureDB";
const STORE = "archives";
let db;

function openDB() {
    return new Promise(resolve => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => {
            db = e.target.result;
            if (!db.objectStoreNames.contains(STORE)) {
                db.createObjectStore(STORE, { keyPath: "id" });
            }
        };
        req.onsuccess = e => {
            db = e.target.result;
            resolve();
        };
    });
}

async function save() {
    await openDB();
    const data = {
        id: Date.now().toString(),
        q: document.getElementById("q").value,
        book: document.getElementById("book").value,
        id: document.getElementById("editId").value,
        cate: document.getElementById("cate").value,
        ans: document.getElementById("ans").value,
        excerpt: document.getElementById("excerpt").value,
        summary: document.getElementById("summary").value,
        source: document.getElementById("source").value
    };
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).add(data);
    tx.oncomplete = () => {
        alert("保存成功！");
        location.href = "search.html";
    };
}
</script>
</body>
</html>
