<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>检索</title>
    <style>
        :root{--main:#9B7BCC;--light:#f6f3fc}
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#f9f9f9;padding:20px}
        .container{max-width:700px;margin:auto}
        .card{background:white;padding:18px;margin:10px 0;border-radius:10px;cursor:pointer}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center}
        .modalBody{background:white;width:90%;max-width:500px;padding:24px;border-radius:12px}
        .cate{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
        .cate span{background:var(--light);padding:6px 10px;border-radius:20px;cursor:pointer}
        .cate .active{background:var(--main);color:white}
        input{padding:10px;width:100%;margin:10px 0;border-radius:6px;border:1px solid #ddd}
    </style>
</head>
<body>
<div class="container">
    <h2>档案检索</h2>
    <input id="search" placeholder="搜索书名/问题" oninput="load()">
    <div class="cate">
        <span class="active" onclick="filter('全部')">全部</span>
        <span onclick="filter('世界文学')">世界文学</span>
        <span onclick="filter('社会认知')">社会认知</span>
        <span onclick="filter('情绪心理')">情绪心理</span>
        <span onclick="filter('人文历史')">人文历史</span>
        <span onclick="filter('职场技能')">职场技能</span>
        <span onclick="filter('商业理财')">商业理财</span>
        <span onclick="filter('自我成长')">自我成长</span>
    </div>
    <div id="list"></div>
</div>

<div class="modal" id="modal">
    <div class="modalBody">
        <div id="detail"></div>
        <br>
        <button onclick="closeModal()">关闭</button>
    </div>
</div>

<script>
const DB_NAME = "WomenFutureDB";
const STORE = "archives";
let db;
let currentCate = "全部";

function openDB() {
    return new Promise(resolve => {
        const req = indexedDB.open(DB_NAME,1);
        req.onupgradeneeded = e=>{
            db=e.target.result;
            if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:"id"});
        };
        req.onsuccess=e=>{db=e.target.result;resolve()};
    });
}

async function load(){
    await openDB();
    const tx=db.transaction(STORE,"readonly");
    const req=tx.objectStore(STORE).getAll();
    req.onsuccess=()=>{
        let list=req.result;
        if(currentCate!=="全部") list=list.filter(i=>i.cate===currentCate);
        const kw=document.getElementById("search").value.toLowerCase();
        if(kw) list=list.filter(i=>i.q.toLowerCase().includes(kw)||i.book.toLowerCase().includes(kw));
        render(list);
    };
}

function render(list){
    const box=document.getElementById("list");
    box.innerHTML=list.map(i=>`
        <div class="card" onclick="openDetail(${JSON.stringify(i).replace(/"/g,"&quot;")})">
            <h4>${i.q}</h4>
            <p>书名：${i.book}</p>
            <p>ID：${i.id}</p>
        </div>
    `).join("");
}

function filter(cate){
    currentCate=cate;
    load();
}

function openDetail(item){
    document.getElementById("detail").innerHTML=`
        <h3>${item.q}</h3>
        <p><b>书名：</b>${item.book}</p>
        <p><b>ID：</b>${item.id}</p>
        <p><b>分类：</b>${item.cate}</p>
        <p><b>答案：</b>${item.ans}</p>
        <p><b>摘录：</b>${item.excerpt}</p>
        <p><b>总结：</b>${item.summary}</p>
        <p><b>渠道：</b>${item.source}</p>
    `;
    document.getElementById("modal").style.display="flex";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

window.onload=load;
</script>
</body>
</html>
