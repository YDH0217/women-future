<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women Future</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #FAF9FC;
            background: linear-gradient(120deg, #FAF9FC 0%, #F5F1FB 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
        }

        /* 导航在标题上方 */
        .top-nav {
            margin-bottom: 24px;
            text-align: center;
        }
        .top-nav a {
            font-size: 17px;
            color: #7A57B8;
            text-decoration: underline;
            text-underline-offset: 6px;
            text-decoration-color: rgba(122, 87, 184, 0.4);
            padding: 8px 16px;
            margin: 0 10px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .top-nav a:hover {
            color: #9B7BCC;
            background: rgba(155, 123, 204, 0.08);
            text-decoration-color: #9B7BCC;
        }

        .content {
            z-index: 2;
            text-align: center;
            padding: 0 20px;
            cursor: pointer;
        }
        h1 {
            font-size: 68px;
            color: #9B7BCC;
            letter-spacing: 3px;
            line-height: 1.2;
            margin-bottom: 8px;
        }
        .slogan {
            font-size: 18px;
            color: #7A57B8;
            font-weight: 400;
            opacity: 0.9;
        }

        .decor {
            position: absolute;
            z-index: 1;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(155, 123, 204, 0.08);
            top: 10%;
            right: 10%;
        }
        .decor-2 {
            position: absolute;
            z-index: 1;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(122, 87, 184, 0.06);
            bottom: 15%;
            left: 8%;
        }
    </style>
</head>
<body>

    <!-- 三个可点击的导航 -->
    <div class="top-nav">
        <a href="search.html">检索</a>
        <a href="create.html">新建档案</a>
        <a href="mine.html">我的中心</a>
    </div>

    <!-- 装饰 -->
    <div class="decor"></div>
    <div class="decor-2"></div>

    <!-- 标题点击返回首页 -->
    <div class="content" onclick="window.location.href='index.html'">
        <h1>Women Future</h1>
        <div class="slogan">We Create Together</div>
    </div>

</body>
</html>
